<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manas — Showreel 2026</title>
    <style>
      @font-face {
        font-family: GS;
        src: url('../src/fonts/general-sans-500.woff2') format('woff2');
        font-weight: 500;
      }
      @font-face {
        font-family: GS;
        src: url('../src/fonts/general-sans-600.woff2') format('woff2');
        font-weight: 600;
      }
      @font-face {
        font-family: GS;
        src: url('./fonts/general-sans-700.woff2') format('woff2');
        font-weight: 700;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #ddd;
        font: 13px Menlo, monospace;
      }
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        width: min(100vw, calc((100vh - 48px) * 16 / 9));
        aspect-ratio: 16 / 9;
      }
      #ui {
        display: flex;
        gap: 12px;
        align-items: center;
        width: min(100vw, calc((100vh - 48px) * 16 / 9));
        padding: 10px 12px;
        box-sizing: border-box;
      }
      #ui input {
        flex: 1;
      }
      #ui button {
        background: #222;
        color: #eee;
        border: 0;
        border-radius: 999px;
        padding: 6px 14px;
        font: inherit;
        cursor: pointer;
      }
      .render #ui {
        display: none;
      }
      .render canvas {
        width: 1920px;
      }
    </style>
  </head>
  <body>
    <div>
      <canvas id="reel" width="1920" height="1080"></canvas>
      <div id="ui">
        <button id="play" type="button">Pause</button>
        <input id="scrub" type="range" min="0" max="15" step="0.001" value="0" aria-label="Scrub" />
        <span id="time">0.00s</span>
      </div>
    </div>
    <script src="./reel.js"></script>
    <script>
      // Preview player (hidden when render.mjs loads the page with ?render).
      if (new URLSearchParams(location.search).has('render')) {
        document.documentElement.classList.add('render');
      } else {
        const { renderFrame, DUR } = window.REEL;
        const play = document.getElementById('play');
        const scrub = document.getElementById('scrub');
        const time = document.getElementById('time');
        let playing = true;
        let t = 0;
        let last = performance.now();
        const tick = (now) => {
          if (playing) t = (t + (now - last) / 1000) % DUR;
          last = now;
          renderFrame(t);
          scrub.value = t;
          time.textContent = t.toFixed(2) + 's';
          requestAnimationFrame(tick);
        };
        window.reelReady.then(() => requestAnimationFrame(tick));
        const toggle = () => {
          playing = !playing;
          play.textContent = playing ? 'Pause' : 'Play';
        };
        play.onclick = toggle;
        addEventListener('keydown', (e) => e.code === 'Space' && (e.preventDefault(), toggle()));
        scrub.oninput = () => {
          t = +scrub.value;
          playing = false;
          play.textContent = 'Play';
        };
      }
    </script>
  </body>
</html>
